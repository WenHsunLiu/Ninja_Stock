name: Schedule sign-in preflight
run-name: Check Supabase schedule sign-in

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        default: bundle
        type: string
      source:
        required: true
        default: core
        type: string
      days:
        default: '3'
        type: string

permissions: {}

jobs:
  verify:
    if: github.ref == 'refs/heads/codex/supabase-auth-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify the schedule account can sign in
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SYNC_EMAIL: ${{ secrets.SUPABASE_SYNC_EMAIL }}
          SUPABASE_SYNC_PASSWORD: ${{ secrets.SUPABASE_SYNC_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          origin = "https://raoxhpcamwqygrhpwuoe.supabase.co"
          if os.environ["SUPABASE_URL"].strip().rstrip("/") != origin:
              raise SystemExit("SUPABASE_URL does not match the intended project.")
          key = os.environ["SUPABASE_PUBLISHABLE_KEY"].strip()
          if not key.startswith("sb_publishable_"):
              raise SystemExit("Expected a Supabase publishable key.")
          email = os.environ["SUPABASE_SYNC_EMAIL"].strip()
          password = os.environ["SUPABASE_SYNC_PASSWORD"]
          if "@" not in email or not password:
              raise SystemExit("Scheduling account credentials are missing or malformed.")

          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          def post(path, stage, data=None, bearer=None):
              headers = {"apikey": key, "Content-Type": "application/json"}
              if bearer:
                  headers["Authorization"] = "Bearer " + bearer
              req = urllib.request.Request(origin + path, data=json.dumps(data or {}).encode(),
                                           headers=headers, method="POST")
              try:
                  with opener.open(req, timeout=12) as response:
                      return response.read()
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"{stage} failed with HTTP {error.code}.") from None
              except (OSError, ValueError):
                  raise SystemExit(f"{stage} could not complete.") from None

          raw = post("/auth/v1/token?grant_type=password", "Sign-in",
                     {"email": email, "password": password})
          try:
              session = json.loads(raw)
              token = session.get("access_token")
              user = session.get("user") or {}
          except (AttributeError, ValueError):
              raise SystemExit("Sign-in returned an unexpected response.") from None
          if not token:
              raise SystemExit("Sign-in did not return a session.")
          post("/auth/v1/logout?scope=local", "Test session sign-out", bearer=token)
          if (user.get("email") or "").casefold() != email.casefold():
              raise SystemExit("Signed-in identity did not match the configured address.")
          print("PASS: the saved scheduling credentials signed in to the intended project and the test session was signed out.")
          PY
